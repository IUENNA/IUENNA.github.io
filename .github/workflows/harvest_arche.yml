name: Harvest ARCHE Statistics (manual helper)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh legacy statistics helper only
        run: python3 scripts/harvest_arche.py

      - name: Commit statistics if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/arche_stats.json
          if git diff --staged --quiet; then
            echo "No changes in ARCHE statistics."
          else
            git commit -m "chore(data): refresh legacy ARCHE statistics helper [skip ci]"
            git push
          fi

# The scheduled authoritative refresh now lives in test_arche_graph.yml and
# rebuilds the full chain: ARCHE metadata -> corpus -> audited graph -> BYOAI/MCP
# metadata -> data/iuenna_kb.json.  Keeping this workflow manual prevents a
# second independent path from rebuilding the AI knowledge base.
