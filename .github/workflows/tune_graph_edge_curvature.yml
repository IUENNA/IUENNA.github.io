name: Tune Graph Edge Curvature

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tune_graph_edge_curvature.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Soften hierarchical edge curvature
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('graph/layouts.js')
          text = p.read_text(encoding='utf-8')
          old = '''        return {\n            weight: Math.max(0.08, Math.min(0.92, (px * dx + py * dy) / len2)),\n            distance: (px * (-dy) + py * dx) / len\n        };'''
          new = '''        const rawDistance = (px * (-dy) + py * dx) / len;\n        const maxOffset = Math.min(120, len * 0.20);\n        return {\n            weight: Math.max(0.15, Math.min(0.85, (px * dx + py * dy) / len2)),\n            distance: Math.max(-maxOffset, Math.min(maxOffset, rawDistance * 0.42))\n        };'''
          if old not in text:
              raise SystemExit('Expected control-point block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          for name in ['scripts/inject_graph_layout_module.py', 'graph/index.html', 'graph/graph.html']:
              q = Path(name)
              if not q.exists():
                  continue
              s = q.read_text(encoding='utf-8')
              s = s.replace('layouts.js?v=20260912-3', 'layouts.js?v=20260912-4')
              q.write_text(s, encoding='utf-8')

          rv = Path('graph/runtime-version.json')
          if rv.exists():
              s = rv.read_text(encoding='utf-8')
              s = re.sub(r'"layout_runtime"\s*:\s*"layouts\.js\?v=[^"]+"', '"layout_runtime": "layouts.js?v=20260912-4"', s)
              rv.write_text(s, encoding='utf-8')
          PY
          node --check graph/layouts.js
          grep -q 'rawDistance \* 0.42' graph/layouts.js
          grep -q 'Math.min(120, len \* 0.20)' graph/layouts.js
          grep -q './layouts.js?v=20260912-4' graph/index.html
      - name: Commit tuned curvature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graph/layouts.js graph/index.html graph/runtime-version.json scripts/inject_graph_layout_module.py
          if [ -f graph/graph.html ]; then git add graph/graph.html; fi
          git commit -m "fix(graph): soften bundled edge curvature"
          git pull --rebase origin main
          git push origin HEAD:main
