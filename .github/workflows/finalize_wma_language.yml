name: Finalize WMA Language and Privacy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize_wma_language.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply final WMA language and privacy pass
        run: python scripts/finalize_wma_language.py
      - name: Validate result
        run: |
          python -m py_compile scripts/finalize_wma_language.py scripts/refresh_site_ui.py
          node --check scripts/nav.js
          grep -q 'Further reading:' wma/qgis2web/qgis2web-index.html
          grep -q 'Measure distances and areas' wma/qgis2web/qgis2web-index.html
          grep -q 'https://tile.openstreetmap.org' wma/qgis2web/qgis2web-index.html
          grep -q 'OpenStreetMap-Nominatim' impressum-datenschutz.md
          grep -q 'sessionStorage' impressum-datenschutz.html
          grep -q '<meta name="DC.language" content="en">' index.html
      - name: Commit generated changes and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize_wma_language.yml scripts/finalize_wma_language.py
          git add wma/qgis2web/qgis2web-index.html wma/qgis2web-home.html impressum-datenschutz.html impressum-datenschutz.md index.html
          git commit -m "fix(wma): finish English UI and map privacy disclosure"
          git pull --rebase origin main
          git push origin HEAD:main
