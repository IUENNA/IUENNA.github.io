name: Validate Remote MCP Worker

on:
  pull_request:
    paths:
      - 'mcp-remote/**'
      - '.github/workflows/remote_mcp_worker.yml'
  push:
    branches:
      - main
    paths:
      - 'mcp-remote/**'
      - '.github/workflows/remote_mcp_worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp-remote
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Cloudflare bundle dry run
        run: npm run dry-run
