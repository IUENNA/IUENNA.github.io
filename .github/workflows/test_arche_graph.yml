name: Test ARCHE Graph Semantics

on:
  pull_request:
    paths:
      - 'scripts/build_complete_arche_graph.py'
      - 'scripts/build_authoritative_corpus.py'
      - 'scripts/build_arche_graph.py'
      - 'tests/**'
      - '.github/workflows/test_arche_graph.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install graph dependency
        run: python -m pip install networkx

      - name: Compile graph builders
        run: |
          python -m py_compile scripts/build_complete_arche_graph.py
          python -m py_compile scripts/build_authoritative_corpus.py
          python -m py_compile scripts/build_arche_graph.py

      - name: Run semantic regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
