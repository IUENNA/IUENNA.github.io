name: Test and Build ARCHE Graph Semantics

on:
  pull_request:
    paths:
      - 'scripts/fetch_arche_full_metadata.py'
      - 'scripts/parse_arche_full_ttl.py'
      - 'scripts/build_complete_arche_graph.py'
      - 'scripts/compact_arche_graph.py'
      - 'scripts/build_graph_lod.py'
      - 'scripts/build_corpus_browser_index.py'
      - 'scripts/build_authoritative_corpus.py'
      - 'scripts/build_arche_graph.py'
      - 'scripts/sync_graph_metadata.py'
      - 'scripts/sync_ai_text_corpus.py'
      - 'scripts/build_chat_kb.py'
      - 'scripts/build_ai_stack.py'
      - 'scripts/generate_synthetic_qa.py'
      - 'byoai.html'
      - 'llms.txt'
      - 'data/openapi.json'
      - 'mcp/**'
      - 'tests/**'
      - '.gitignore'
      - '.gitattributes'
      - '.github/workflows/test_arche_graph.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/build_graph_lod.py'
      - 'scripts/build_corpus_browser_index.py'
      - 'scripts/sync_graph_metadata.py'
      - 'scripts/sync_ai_text_corpus.py'
      - 'scripts/build_chat_kb.py'
      - 'scripts/build_ai_stack.py'
      - '.github/workflows/test_arche_graph.yml'
  schedule:
    # Weekly canonical ARCHE -> graph -> LOD/BYOAI/Chat-KB refresh.
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install graph dependencies
        run: python -m pip install networkx numpy scipy

      - name: Compile graph and AI pipeline
        run: |
          python -m py_compile scripts/fetch_arche_full_metadata.py
          python -m py_compile scripts/parse_arche_full_ttl.py
          python -m py_compile scripts/build_complete_arche_graph.py
          python -m py_compile scripts/compact_arche_graph.py
          python -m py_compile scripts/build_graph_lod.py
          python -m py_compile scripts/build_corpus_browser_index.py
          python -m py_compile scripts/build_authoritative_corpus.py
          python -m py_compile scripts/build_arche_graph.py
          python -m py_compile scripts/sync_graph_metadata.py
          python -m py_compile scripts/sync_ai_text_corpus.py
          python -m py_compile scripts/build_chat_kb.py
          python -m py_compile scripts/build_ai_stack.py

      - name: Run semantic regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Fetch authoritative IUENNA metadata from ARCHE
        run: python scripts/fetch_arche_full_metadata.py

      - name: Rebuild parsed ARCHE indexes
        run: python scripts/parse_arche_full_ttl.py

      - name: Rebuild authoritative resource corpus
        run: python scripts/build_authoritative_corpus.py

      - name: Build compact browser corpus index
        run: python scripts/build_corpus_browser_index.py

      - name: Rebuild provenance-aware knowledge graph and audit
        run: python scripts/build_complete_arche_graph.py

      - name: Compact published graph representation
        run: python scripts/compact_arche_graph.py data/arche_graph.json

      - name: Build browser LOD graph projection
        run: python scripts/build_graph_lod.py

      - name: Build and validate BYOAI / Chat knowledge stack
        run: python scripts/build_ai_stack.py

      - name: Validate generated outputs
        run: |
          test -s data/arche_full_metadata.ttl
          test -s data/arche_corpus.json
          test -s data/arche_corpus_browser_index.json
          test -s data/arche_graph.json
          test -s data/arche_graph_audit.json
          test -s data/arche_graph_macro.json
          test -s data/arche_graph_lod_manifest.json
          test -d data/graph_shards
          test -s data/iuenna_kb.json
          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path('data/arche_graph_audit.json').read_text(encoding='utf-8'))
          assert audit['status'] == 'pass', audit
          assert audit['invariants']['one_arche_id_one_node'] is True
          assert audit['invariants']['no_dangling_edges'] is True
          assert audit['invariants']['all_resolvable_ttl_relations_preserved'] is True

          corpus_path = Path('data/arche_corpus.json')
          corpus_index_path = Path('data/arche_corpus_browser_index.json')
          corpus = json.loads(corpus_path.read_text(encoding='utf-8'))
          corpus_index = json.loads(corpus_index_path.read_text(encoding='utf-8'))
          assert corpus_index['metadata']['mode'] == 'browser-discovery-index'
          assert corpus_index['metadata']['authoritative_source'] == 'arche_corpus.json'
          assert corpus_index['metadata']['non_authoritative_projection'] is True
          assert len(corpus_index['resources']) == len(corpus['resources'])
          assert corpus_index['metadata']['total_resources'] == len(corpus['resources'])
          assert corpus_index_path.stat().st_size < corpus_path.stat().st_size
          assert corpus_index_path.stat().st_size < 15 * 1024 * 1024, 'Browser corpus index exceeds 15 MiB performance budget'

          graph_path = Path('data/arche_graph.json')
          graph_size = graph_path.stat().st_size
          assert graph_size < 100 * 1024 * 1024, f'arche_graph.json exceeds GitHub 100 MiB limit: {graph_size}'
          graph = json.loads(graph_path.read_text(encoding='utf-8'))
          assert 'edge_encoding' in graph['metadata']

          macro_path = Path('data/arche_graph_macro.json')
          macro = json.loads(macro_path.read_text(encoding='utf-8'))
          manifest = json.loads(Path('data/arche_graph_lod_manifest.json').read_text(encoding='utf-8'))
          full_nodes = len(graph['elements']['nodes'])
          full_edges = len(graph['elements']['edges'])
          macro_nodes = len(macro['elements']['nodes'])
          macro_edges = len(macro['elements']['edges'])
          lazy = manifest['lazy_resource_nodes']
          assert manifest['full_nodes'] == full_nodes == audit['graph']['nodes']
          assert manifest['full_edges'] == full_edges == audit['graph']['edges']
          assert manifest['macro_nodes'] == macro_nodes
          assert manifest['macro_edges'] == macro_edges
          assert macro_nodes + lazy == full_nodes
          assert len(manifest['resource_to_collection']) == lazy
          assert manifest['shard_count'] == len(manifest['collections'])
          assert manifest['shard_count'] > 0
          assert macro_nodes < 2000, f'Macro graph unexpectedly large: {macro_nodes}'
          assert macro_path.stat().st_size < 15 * 1024 * 1024, 'Macro graph exceeds 15 MiB performance budget'
          assert sum(v['resource_count'] for v in manifest['collections'].values()) == lazy
          for entry in manifest['collections'].values():
              shard = Path('data') / entry['url']
              assert shard.is_file() and shard.stat().st_size > 0, shard

          kb = json.loads(Path('data/iuenna_kb.json').read_text(encoding='utf-8'))
          expected_nodes = audit['graph']['nodes']
          expected_edges = audit['graph']['edges']
          assert len(kb['graph_entities']) == expected_nodes
          assert kb['build_metadata']['graph_nodes'] == expected_nodes
          assert kb['build_metadata']['graph_edges'] == expected_edges
          assert kb['build_metadata']['audit_status'] == 'pass'
          assert kb['build_metadata']['configured_arche_recall'] == 1.0
          assert '20,788 digital resources' not in Path('data/iuenna_kb.json').read_text(encoding='utf-8')

          print(json.dumps(audit['invariants'], indent=2))
          print(f"Authoritative corpus: {len(corpus['resources']):,} resources / {corpus_path.stat().st_size / 1024 / 1024:.2f} MiB")
          print(f"Browser corpus index: {len(corpus_index['resources']):,} resources / {corpus_index_path.stat().st_size / 1024 / 1024:.2f} MiB")
          print(f"Authoritative graph: {full_nodes:,} nodes / {full_edges:,} edges / {graph_size / 1024 / 1024:.2f} MiB")
          print(f"Browser macro graph: {macro_nodes:,} nodes / {macro_edges:,} edges / {macro_path.stat().st_size / 1024 / 1024:.2f} MiB")
          print(f"Lazy resources: {lazy:,} across {manifest['shard_count']:,} collection shards")
          print(f"AI KB graph entities: {len(kb['graph_entities']):,}")
          PY

      - name: Publish authoritative graph and AI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: iuenna-arche-authoritative-stack-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          compression-level: 6
          path: |
            data/arche_full_metadata.ttl
            data/arche_corpus.json
            data/arche_corpus_browser_index.json
            data/arche_graph.json
            data/arche_graph_audit.json
            data/arche_graph_macro.json
            data/arche_graph_lod_manifest.json
            data/graph_shards/
            data/arche_collections_tree.json
            data/arche_resolved_entities.json
            data/arche_collection_creators.json
            data/arche_publications.json
            data/arche_places.json
            data/arche_datasets.json
            data/arche_search_index.json
            data/iuenna_kb.json
            data/iuenna_synthetic_qa.json
            data/iuenna_finetune_alpaca.json
            data/iuenna_finetune_chatml.jsonl
            data/iuenna_finetune_sharegpt.json
            byoai.html
            llms.txt
            data/openapi.json

      - name: Commit refreshed authoritative data and AI metadata
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'push' || github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/arche_full_metadata.ttl \
            data/arche_corpus.json \
            data/arche_corpus_browser_index.json \
            data/arche_graph.json \
            data/arche_graph_audit.json \
            data/arche_graph_macro.json \
            data/arche_graph_lod_manifest.json \
            data/graph_shards \
            data/arche_collections_tree.json \
            data/arche_resolved_entities.json \
            data/arche_collection_creators.json \
            data/arche_publications.json \
            data/arche_places.json \
            data/arche_datasets.json \
            data/arche_search_index.json \
            data/iuenna_kb.json \
            data/iuenna_synthetic_qa.json \
            data/iuenna_finetune_alpaca.json \
            data/iuenna_finetune_chatml.jsonl \
            data/iuenna_finetune_sharegpt.json \
            DOKUMENTATION.md \
            llms.txt \
            byoai.html \
            data/openapi.json \
            mcp/index.mjs \
            mcp/server.py \
            scripts/generate_synthetic_qa.py \
            scripts/export_arche_graph_ttl.py \
            scripts/iuenna-chat.js
          if git diff --cached --quiet; then
            echo "Authoritative ARCHE graph, LOD projection and AI stack already up to date."
          else
            git commit -m "chore(data): refresh authoritative ARCHE graph, LOD and AI stack"
            TARGET_BRANCH="${{ github.head_ref || github.ref_name }}"
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
            git push origin HEAD:"$TARGET_BRANCH"
          fi
