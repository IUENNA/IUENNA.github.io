name: Finalize Remote MCP Documentation

on:
  push:
    paths:
      - '.github/workflows/finalize_remote_mcp_docs.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('DOKUMENTATION.md')
          s = p.read_text(encoding='utf-8')
          old = '     - Zentrale englischsprachige Dokumentations- und Rezepte-Seite mit Copy-Paste-Cookbook für lokales Ollama/Llama 3.2, Open-WebUI, cURL/jq, Python/NetworkX und Google NotebookLM.'
          new = '     - Zentrale englischsprachige Dokumentationsseite mit einer einzigen Copy-Paste-URL für den öffentlichen Remote MCP sowie direkten Verweisen auf die offenen JSON-, OpenAPI- und `llms.txt`-Schnittstellen.'
          if old not in s:
              raise SystemExit('Expected BYOAI-Hub documentation line not found')
          s = s.replace(old, new, 1)
          marker = '  - BYOAI Hub: `https://iuenna.github.io/byoai.html`\n'
          insertion = marker + '  - Remote MCP: `https://iuenna-mcp.dominik-hagmann13.workers.dev/mcp`\n'
          if marker not in s:
              raise SystemExit('Expected deployment URL marker not found')
          s = s.replace(marker, insertion, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git rm -f .github/workflows/finalize_remote_mcp_docs.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DOKUMENTATION.md
          git commit -m "docs(mcp): finalize Remote MCP-only documentation"
          git pull --rebase origin main
          git push origin HEAD:main
