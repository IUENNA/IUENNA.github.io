name: Tune Graph Layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tune_graph_layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tune hierarchy, COSE geometry and edge routing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import json

          p = Path('graph/layouts.js')
          text = p.read_text(encoding='utf-8')

          old = '    const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));\n'
          new = '''    const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));\n    const EDGE_BUNDLE_DISTANCE_SCALE = 0.36;\n    const EDGE_BUNDLE_MAX_RATIO = 0.16;\n    const EDGE_BUNDLE_MAX_PX = 90;\n    const ROOT_CORRIDOR_PULL = 0.22;\n'''
          if old not in text:
              raise SystemExit('Could not find layout tuning constants anchor')
          text = text.replace(old, new, 1)

          anchor = '''        return 30;\n    }\n\n    function installHomepagePalette() {'''
          helpers = '''        return 30;\n    }\n\n    function nodeLevel(node) {\n        const value = Number(node && node.data ? node.data("level") : NaN);\n        return Number.isFinite(value) ? value : null;\n    }\n\n    function coseNodeRepulsion(node) {\n        const type = node.data("type");\n        const level = nodeLevel(node);\n        if (type === "root" || level === 0 || node.id() === "iuenna_root") return 2600000;\n        if (type === "subcollection" || level === 1) return 1700000;\n        if (level === 2) return 900000;\n        if (["dataset", "person", "organization", "place", "publication"].includes(type)) return 650000;\n        return 420000;\n    }\n\n    function coseIdealEdgeLength(edge) {\n        if (edge.data("label") !== "isPartOf") return 165;\n        const source = edge.source();\n        const target = edge.target();\n        if (target.id() === "iuenna_root" || target.data("type") === "root") return 235;\n        const level = nodeLevel(source);\n        if (level === null) return 105;\n        if (level <= 1) return 205;\n        if (level === 2) return 130;\n        if (level === 3) return 102;\n        if (level === 4) return 86;\n        return 74;\n    }\n\n    function coseEdgeElasticity(edge) {\n        if (edge.data("label") !== "isPartOf") return 58;\n        const source = edge.source();\n        const target = edge.target();\n        if (target.id() === "iuenna_root" || target.data("type") === "root") return 85;\n        const level = nodeLevel(source);\n        if (level === null || level <= 1) return 110;\n        if (level === 2) return 145;\n        return 185;\n    }\n\n    function routingCorridor(sourceHub, targetHub, rootPos) {\n        const mid = {\n            x: (sourceHub.x + targetHub.x) / 2,\n            y: (sourceHub.y + targetHub.y) / 2\n        };\n        if (!rootPos) return mid;\n        return {\n            x: mid.x * (1 - ROOT_CORRIDOR_PULL) + rootPos.x * ROOT_CORRIDOR_PULL,\n            y: mid.y * (1 - ROOT_CORRIDOR_PULL) + rootPos.y * ROOT_CORRIDOR_PULL\n        };\n    }\n\n    function installHomepagePalette() {'''
          if anchor not in text:
              raise SystemExit('Could not find hierarchy helper anchor')
          text = text.replace(anchor, helpers, 1)

          text = text.replace(
              '        const maxOffset = Math.min(120, len * 0.20);',
              '        const maxOffset = Math.min(EDGE_BUNDLE_MAX_PX, len * EDGE_BUNDLE_MAX_RATIO);',
              1,
          )
          text = text.replace(
              '            distance: Math.max(-maxOffset, Math.min(maxOffset, rawDistance * 0.42))',
              '            distance: Math.max(-maxOffset, Math.min(maxOffset, rawDistance * EDGE_BUNDLE_DISTANCE_SCALE))',
              1,
          )

          old_bundle = '''            if (edge.data("label") === "isPartOf") {\n                edge.removeStyle("control-point-weights control-point-distances");\n                edge.style("curve-style", "bezier");\n                return;\n            }\n            const sHubId = topHub(edge.source().id(), parents);\n            const tHubId = topHub(edge.target().id(), parents);\n            const sHub = c.$id(sHubId);\n            const tHub = c.$id(tHubId);\n            const points = [];\n            if (sHub.length && sHubId !== edge.source().id()) points.push(sHub.position());\n            if (sHubId !== tHubId && rootPos) points.push(rootPos);\n            if (tHub.length && tHubId !== edge.target().id()) points.push(tHub.position());\n'''
          new_bundle = '''            if (edge.data("label") === "isPartOf") {\n                edge.removeStyle("control-point-weights control-point-distances");\n                edge.style("curve-style", "straight");\n                return;\n            }\n            const sHubId = topHub(edge.source().id(), parents);\n            const tHubId = topHub(edge.target().id(), parents);\n            const sHub = c.$id(sHubId);\n            const tHub = c.$id(tHubId);\n\n            // Relations inside the same top-level collection remain nearly direct.\n            // Bundling is reserved for cross-collection relations where it improves\n            // readability instead of artificially bending local links.\n            if (sHubId === tHubId) {\n                edge.removeStyle("control-point-weights control-point-distances");\n                edge.style("curve-style", "bezier");\n                return;\n            }\n\n            const points = [];\n            if (sHub.length && sHubId !== edge.source().id()) points.push(sHub.position());\n            if (sHub.length && tHub.length) {\n                points.push(routingCorridor(sHub.position(), tHub.position(), rootPos));\n            }\n            if (tHub.length && tHubId !== edge.target().id()) points.push(tHub.position());\n'''
          if old_bundle not in text:
              raise SystemExit('Could not find edge bundling block')
          text = text.replace(old_bundle, new_bundle, 1)

          old_cose = '''                componentSpacing: 120,\n                nodeRepulsion: node => {\n                    const hierarchyEdges = node.connectedEdges("[label = 'isPartOf']").length;\n                    return 350000 + Math.min(3200000, hierarchyEdges * 450);\n                },\n                idealEdgeLength: edge => edge.data("label") === "isPartOf" ? 115 : 175,\n                edgeElasticity: edge => edge.data("label") === "isPartOf" ? 140 : 70,\n                nestingFactor: 1.15,\n                gravity: 0.35,\n                numIter: 1400,'''
          new_cose = '''                componentSpacing: 170,\n                nodeRepulsion: coseNodeRepulsion,\n                idealEdgeLength: coseIdealEdgeLength,\n                edgeElasticity: coseEdgeElasticity,\n                nestingFactor: 1.30,\n                gravity: 0.22,\n                numIter: 1600,'''
          if old_cose not in text:
              raise SystemExit('Could not find COSE tuning block')
          text = text.replace(old_cose, new_cose, 1)

          text = text.replace('                minNodeSpacing: 45,', '                minNodeSpacing: 52,', 1)
          text = text.replace('                levelWidth: () => 5', '                levelWidth: () => 4', 1)
          text = text.replace('                spacingFactor: 1.45,', '                spacingFactor: 1.35,', 1)
          text = text.replace('                spacingFactor: 1.25,', '                spacingFactor: 1.18,', 1)

          # Keep the public UI English while touching the runtime.
          text = text.replace('showLoading("Cluster-Layout laden...", "Vorberechnete Koordinaten werden wiederhergestellt...");', 'showLoading("Loading cluster layout...", "Restoring precomputed coordinates...");')
          text = text.replace('concentric: "Konzentrisch"', 'concentric: "Concentric"')
          text = text.replace('breadthfirst: "Baum-Hierarchie"', 'breadthfirst: "Hierarchy"')
          text = text.replace('circle: "Zirkulär"', 'circle: "Circular"')
          text = text.replace('showLoading(`Layout: ${label}`, `Berechne ${workingNodes.length.toLocaleString()} Knoten mit ${edgeCount.toLocaleString()} Relationen...`);', 'showLoading(`Layout: ${label}`, `Computing ${workingNodes.length.toLocaleString()} nodes with ${edgeCount.toLocaleString()} relations...`);')
          text = text.replace('notify(`${label}: Topologie auf ${workingNodes.length.toLocaleString()} Strukturknoten berechnet; Ressourcen an Elternsammlungen verankert.`, "success", 3500);', 'notify(`${label}: topology computed for ${workingNodes.length.toLocaleString()} structural nodes; resources anchored to parent collections.`, "success", 3500);')
          text = text.replace('notify(`Layout konnte nicht berechnet werden: ${error.message || error}`, "warning", 5000);', 'notify(`Layout could not be computed: ${error.message || error}`, "warning", 5000);')

          p.write_text(text, encoding='utf-8')

          # Cache/version consistency for both graph entry points and injector.
          for name in ['scripts/inject_graph_layout_module.py', 'graph/index.html', 'graph/graph.html']:
              q = Path(name)
              if not q.exists():
                  continue
              s = q.read_text(encoding='utf-8')
              s = s.replace('layouts.js?v=20260912-4', 'layouts.js?v=20260912-5')
              q.write_text(s, encoding='utf-8')

          rv = Path('graph/runtime-version.json')
          data = json.loads(rv.read_text(encoding='utf-8'))
          data['version'] = '2026-09-12-progressive-layout-tuning-2'
          data['layout_runtime'] = 'layouts.js?v=20260912-5'
          data['data_runtime'] = 'data-source.js?v=20260912-4'
          data['mode'] = 'progressive-macro-plus-resource-shards-with-hierarchy-aware-layout'
          rv.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Documentation: replace the old direct-root description and add exact tuning values.
          doc = Path('DOKUMENTATION.md')
          d = doc.read_text(encoding='utf-8')
          d = d.replace(
              '`graph/layouts.js` bündelt nicht-hierarchische Beziehungen entlang gemeinsamer Collection-Hubs und – bei Beziehungen zwischen verschiedenen Top-Level-Bereichen – entlang des IUENNA-Wurzelknotens. Dadurch bleibt ein dichtes semantisches Netzwerk lesbarer, ohne Beziehungen zu entfernen.',
              '`graph/layouts.js` behandelt Hierarchie- und semantische Beziehungen bewusst unterschiedlich. Beziehungen innerhalb desselben Top-Level-Collection-Bereichs bleiben weitgehend direkt; nur Beziehungen zwischen unterschiedlichen Top-Level-Bereichen werden hierarchieorientiert gebündelt. Dafür wird ein Routing-Korridor zwischen den beiden Collection-Hubs berechnet, der nur schwach zum IUENNA-Wurzelknoten gewichtet wird. Dadurch bleibt ein dichtes semantisches Netzwerk lesbarer, ohne Beziehungen zu entfernen oder lokale Verbindungen künstlich stark zu krümmen.'
          )
          marker = '* Die visuelle Grundpalette wurde an die IUENNA-Startseite angeglichen; selektierte bzw. hervorgehobene Beziehungen erhalten deutlich höhere Sichtbarkeit.\n'
          addition = '''* Die visuelle Grundpalette wurde an die IUENNA-Startseite angeglichen; selektierte bzw. hervorgehobene Beziehungen erhalten deutlich höhere Sichtbarkeit.\n\n#### Layout-Fine-Tuning vom 12.09.2026\n\nDer zweite Layout-Tuning-Pass verfolgt das Prinzip **intern kompakter, zwischen Hauptclustern großzügiger, semantische Cross-Links sanft gebündelt**. Er verändert ausschließlich die Browservisualisierung; Knoten, Kanten, Provenienz und der autoritative Graph bleiben unverändert.\n\n| Parameter / Regel | Aktueller Wert | Zweck |\n|---|---:|---|\n| Initiale Makrotiefe | `2` | Schneller, klarer First Paint; tiefere Hierarchien werden progressiv materialisiert. |\n| `isPartOf`-Kanten | `straight` | Hierarchiestruktur bleibt unmittelbar lesbar und wird nicht künstlich gebogen. |\n| Lokale semantische Kanten | normales `bezier` | Beziehungen innerhalb desselben Top-Level-Clusters bleiben nahezu direkt. |\n| Cross-Collection-Kanten | `unbundled-bezier` | Nur clusterübergreifende Beziehungen werden gebündelt. |\n| Root-Einfluss auf Routing-Korridor | `0.22` | Der Wurzelknoten dient nur schwach als Orientierung; ein Radnaben-Effekt wird vermieden. |\n| Bundling-Distanzfaktor | `0.36` | Reduziert die seitliche Ablenkung der Kontrollpunkte. |\n| Max. Bundling-Abweichung | `min(90 px, 16 % der Kantenlänge)` | Verhindert überzeichnete Bögen bei langen Verbindungen. |\n| COSE `componentSpacing` | `170` | Größere visuelle Trennung übergeordneter Bereiche. |\n| COSE `gravity` | `0.22` | Schwächerer Zug zum globalen Zentrum. |\n| COSE `nestingFactor` | `1.30` | Stärkere hierarchische Gliederung. |\n| COSE Iterationen | `1600` | Stabilere Konvergenz des Strukturgraphen. |\n| Root-Repulsion | `2,600,000` | Verhindert Verdichtung am Projektwurzelknoten. |\n| L1-Repulsion | `1,700,000` | Hält die sechs Hauptsammlungen deutlicher auseinander. |\n| L2-Repulsion | `900,000` | Erhält Abstand in der Übersichtsebene. |\n| Kontextknoten-Repulsion | `650,000` | Gibt Datasets, Personen, Organisationen, Orte und Publikationen ausreichend Raum. |\n| Sonstige Strukturknoten | `420,000` | Tiefere Teilstrukturen bleiben kompakter. |\n| `isPartOf`-Ideallänge Root | `235` | Hauptsammlungen liegen deutlich vom Root entfernt. |\n| `isPartOf`-Ideallänge L1 | `205` | Top-Level-Cluster erhalten Raum. |\n| `isPartOf`-Ideallänge L2 | `130` | Unterstrukturen rücken näher zusammen. |\n| `isPartOf`-Ideallänge L3 | `102` | Hierarchie wird mit Tiefe kompakter. |\n| `isPartOf`-Ideallänge L4 | `86` | Feinere Folder bleiben lokal gebündelt. |\n| `isPartOf`-Ideallänge L5+ | `74` | Tiefste Struktur wird bewusst kompakt gehalten. |\n| Sonstige COSE-Kantenlänge | `165` | Semantische Beziehungen bleiben lesbar, ohne Cluster unnötig auseinanderzuziehen. |\n| Concentric `minNodeSpacing` | `52` | Weniger Überlagerung bei Ringdarstellung. |\n| Breadth-first `spacingFactor` | `1.35` | Hierarchische Ansicht bleibt kompakt, aber lesbar. |\n| Circle `spacingFactor` | `1.18` | Vermeidet unnötig weit auseinandergezogene Kreislayouts. |\n\nDie COSE-Kantenelastizität ist ebenfalls hierarchiesensitiv: Root-Verbindungen werden relativ locker (`85`), L1-Verbindungen mit `110`, L2 mit `145` und tiefere `isPartOf`-Verbindungen mit `185` geführt. Nicht-hierarchische Beziehungen verwenden `58`. Damit bleiben tiefe Teilbäume kompakt, während die sechs Hauptbereiche nicht zu stark an den Root gezogen werden.\n\nDas **Preset-Layout bleibt die stabile Referenzansicht**. COSE, Concentric, Hierarchy und Circular sind alternative Explorationslayouts; nach jeder Neuberechnung wird das Edge-Routing erneut aus den aktuellen Knotenpositionen bestimmt.\n'''
          if marker not in d:
              raise SystemExit('Could not find documentation insertion marker')
          d = d.replace(marker, addition, 1)
          doc.write_text(d, encoding='utf-8')
          PY

          node --check graph/layouts.js
          python -m py_compile scripts/inject_graph_layout_module.py
          grep -q 'ROOT_CORRIDOR_PULL = 0.22' graph/layouts.js
          grep -q 'EDGE_BUNDLE_DISTANCE_SCALE = 0.36' graph/layouts.js
          grep -q 'edge.style("curve-style", "straight")' graph/layouts.js
          grep -q 'componentSpacing: 170' graph/layouts.js
          grep -q 'gravity: 0.22' graph/layouts.js
          grep -q './layouts.js?v=20260912-5' graph/index.html
          grep -q 'Layout-Fine-Tuning vom 12.09.2026' DOKUMENTATION.md

      - name: Commit tuned layout and documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graph/layouts.js graph/index.html graph/runtime-version.json scripts/inject_graph_layout_module.py DOKUMENTATION.md
          if [ -f graph/graph.html ]; then git add graph/graph.html; fi
          git commit -m "feat(graph): fine-tune hierarchy layout and document parameters"
          git pull --rebase origin main
          git push origin HEAD:main
